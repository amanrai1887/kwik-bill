services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-reminder-app-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SQL_HOST=postgres
      - SQL_PORT=5432
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_DB_NAME=invoice_saas
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/invoice_saas
      - DB_SSL=false
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_TReZcmt9KLYGJB}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-7FStZMDU6584xYp6O0Zav65d}
      - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID:-rzp_test_TReZcmt9KLYGJB}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JyAIcqKi4sKTwSwYCmNc47Brds2opA_RT6ooSvaA9DAA}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - META_WHATSAPP_TOKEN=${META_WHATSAPP_TOKEN:-}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-invoice-saas-app-fc503}
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: invoice-reminder-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_saas
    ports:
      - "5434:5432"
    volumes:
      - invoice_db_local_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d invoice_saas" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invoice-reminder-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - invoice_redis_local_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  invoice_db_local_data:
  invoice_redis_local_data:
