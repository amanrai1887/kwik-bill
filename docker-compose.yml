services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-reminder-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SQL_HOST=postgres
      - SQL_PORT=5432
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_DB_NAME=invoice_saas
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/invoice_saas
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_TReZcmt9KLYGJB}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-7FStZMDU6584xYp6O0Zav65d}
      - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID:-rzp_test_TReZcmt9KLYGJB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: invoice-reminder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_saas
    ports:
      - "5434:5432"
    volumes:
      - invoice_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  invoice_db_data:
